<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Connecting… · THE REMIXITY</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #120c1f;
        color: #fff;
        font: 600 1rem system-ui, -apple-system, sans-serif;
      }
    </style>
  </head>
  <body>
    <p>Connected. You can close this window.</p>
    <script>
      // Hands SoundCloud's one-time code back to the Remixity tab that opened
      // this window, then closes. The code is useless without the PKCE
      // verifier, which only that tab holds.
      (function () {
        var q = new URLSearchParams(location.search);
        var result = { type: 'sc-auth', code: q.get('code'), state: q.get('state'), error: q.get('error') };
        history.replaceState(null, '', location.pathname); // keep the code out of history
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(result, location.origin);
        } else {
          try {
            localStorage.setItem('sc-auth-result', JSON.stringify(result));
          } catch (e) {}
        }
        setTimeout(function () {
          window.close();
        }, 300);
      })();
    </script>
  </body>
</html>
