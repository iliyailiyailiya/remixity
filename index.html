<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#120c1f" />
    <script>
      // Romanian and Russian readers: hide the English texts the HTML carries

      try {
        var l = new URLSearchParams(location.search).get('lang') || localStorage.getItem('lang') || (navigator.language || 'en').slice(0, 2).toLowerCase();
        if (l === 'ro' || l === 'ru') document.documentElement.classList.add('i18n-wait');
      } catch (e) {}
    </script>
    <title>THE REMIXITY · Slowed and Reverb Generator, Music Player & Story Maker</title>
    <meta
      name="description"
      content="Free slowed and reverb generator and online music editor: slowed, sped up, nightcore and daycore, EQ and trimming. Plus a music player with synced lyrics and an Instagram Story maker."
    />
    <link rel="canonical" href="https://remixity.app/" />
    <meta name="yandex-verification" content="ce0f67ffedb11192" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="THE REMIXITY" />
    <meta property="og:url" content="https://remixity.app/" />
    <meta property="og:title" content="THE REMIXITY · Slowed and Reverb Generator, Music Player & Story Maker" />
    <meta property="og:description" content="Slow down or speed up any song, add reverb, keep your music library with synced lyrics, and turn it into Instagram Stories. Free, in your browser." />
    <meta property="og:image" content="https://remixity.app/img/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="THE REMIXITY: a slowed + reverb editor, music player and story maker" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="THE REMIXITY · Slowed and Reverb Generator, Music Player & Story Maker" />
    <meta name="twitter:description" content="Slow down or speed up any song, add reverb, keep your music library with synced lyrics, and turn it into Instagram Stories." />
    <meta name="twitter:image" content="https://remixity.app/img/og.jpg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://remixity.app/#website",
            "name": "THE REMIXITY",
            "alternateName": ["Remixity", "The Remixity", "remixity.app"],
            "url": "https://remixity.app/"
          },
          {
            "@type": "WebApplication",
            "@id": "https://remixity.app/#app",
            "name": "THE REMIXITY",
            "alternateName": "Remixity",
            "url": "https://remixity.app/",
            "description": "Free online music editor and player: slowed + reverb, nightcore, keep-pitch time stretching, EQ, trimming, a music library with synced lyrics, and an Instagram Story maker. Audio is processed on your device.",
            "applicationCategory": "MultimediaApplication",
            "operatingSystem": "Any (web browser)",
            "browserRequirements": "A modern browser with Web Audio",
            "inLanguage": ["en", "ro", "ru"],
            "isAccessibleForFree": true,
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "featureList": [
              "Slowed + reverb and nightcore with one pedal",
              "Change speed with or without changing pitch",
              "Reverb, echo and a 5-band EQ",
              "Trim and cut sections, loop a part",
              "Export MP3 320 or WAV",
              "Music library with playlists and artists",
              "Synced lyrics that follow the music",
              "Find missing covers and fix song names",
              "Instagram Story videos and images with your remix"
            ]
          }
        ]
      }
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="REMIXITY" />
  </head>
  <body>
    <canvas id="bg" class="bg" aria-hidden="true"></canvas>
    <div id="glowRed" class="glow glow-red" aria-hidden="true"></div>
    <div id="glowBlue" class="glow glow-blue" aria-hidden="true"></div>
    <div class="scrim" aria-hidden="true"></div>

    <input
      id="file"
      class="visually-hidden"
      type="file"
      accept="audio/*,.mp3,.wav,.flac,.m4a,.aac,.ogg,.opus,.aif,.aiff"
    />

    <!-- ===== Home ===== -->
    <section id="home" class="home">
      <select id="lang" class="lang" aria-label="Language">
        <option value="en">EN</option>
        <option value="ro">RO</option>
        <option value="ru">RU</option>
      </select>
      <div class="hero">
        <h1 class="brand"><span class="the">THE</span> <span class="name">REMIXITY</span></h1>
        <p class="pitch" data-i18n="dropTrack"></p>
        <p class="tagline" data-i18n="homeTagline"></p>
        <label for="file" class="cta" data-i18n="chooseSong"></label>
        <button id="openLibraryHome" class="cta-secondary"><svg viewBox="0 0 24 24"><path d="M5 4v16M9.5 4v16" /><path d="M14 4.5l5 15" /></svg><span data-i18n="openLibrary"></span></button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <p class="fine" data-i18n="privacy"></p>
        <a class="more-link" href="#about"><span data-i18n="homeMore"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg></a>
      </div>

      <!-- Home screen only, never in the player. Filled by src/ads.ts once AdSense IDs exist. -->
      <aside id="adSlot" class="ad-slot" hidden>
        <small data-i18n="adLabel"></small>
      </aside>

      <div id="about" class="about">
        <section class="about-card">
          <h2 data-i18n="homeHowTitle"></h2>
          <ol class="steps">
            <li data-i18n="homeStep1"></li>
            <li data-i18n="homeStep2"></li>
            <li data-i18n="homeStep3"></li>
          </ol>
        </section>
        <section class="about-card">
          <h2 data-i18n="homeSlowedTitle"></h2>
          <p data-i18n="homeSlowedText"></p>
        </section>
        <section class="about-card">
          <h2 data-i18n="homeNightcoreTitle"></h2>
          <p data-i18n="homeNightcoreText"></p>
        </section>
        <section class="about-card faq">
          <h2 data-i18n="homeFaqTitle"></h2>
          <details>
            <summary data-i18n="faqFreeQ"></summary>
            <p data-i18n="faqFreeA"></p>
          </details>
          <details>
            <summary data-i18n="faqUploadQ"></summary>
            <p data-i18n="faqUploadA"></p>
          </details>
          <details>
            <summary data-i18n="faqFormatsQ"></summary>
            <p data-i18n="faqFormatsA"></p>
          </details>
          <details>
            <summary data-i18n="faqPitchQ"></summary>
            <p data-i18n="faqPitchA"></p>
          </details>
          <details>
            <summary data-i18n="faqPhoneQ"></summary>
            <p data-i18n="faqPhoneA"></p>
          </details>
          <details>
            <summary data-i18n="faqShareQ"></summary>
            <p data-i18n="faqShareA"></p>
          </details>
        </section>
        <nav class="about-card features" aria-labelledby="featuresTitle">
          <h2 id="featuresTitle" data-i18n="homeFeaturesTitle"></h2>
          <ul>
            <li><a href="/slow-reverb/" data-feature="slow-reverb" data-i18n="featSlow"></a></li>
            <li><a href="/audio-editor/" data-feature="audio-editor" data-i18n="featEditor"></a></li>
            <li><a href="/music-library/" data-feature="music-library" data-i18n="featLibrary"></a></li>
            <li><a href="/instagram-story-maker/" data-feature="instagram-story-maker" data-i18n="featStory"></a></li>
            <li><a href="/music-card-maker/" data-feature="music-card-maker" data-i18n="featCard"></a></li>
          </ul>
        </nav>
        <p class="fine legal"><a href="/privacy" data-i18n="privacyLink"></a> · <a href="/terms" data-i18n="termsLink"></a></p>
        <p class="fine legal made-by"><span data-i18n="madeBy"></span> <a href="https://instagram.com/iliyabarcari" target="_blank" rel="noopener">@iliyabarcari</a></p>
      </div>
    </section>

    <!-- ===== Player ===== -->
    <main id="player" class="player" hidden>
      <header class="topbar">
        <span class="mini-brand">THE <b>REMIXITY</b></span>
        <button id="openLibrary" class="icon-btn" data-i18n-aria="library" aria-label="Library"><svg viewBox="0 0 24 24"><path d="M5 4v16M9.5 4v16" /><path d="M14 4.5l5 15" /></svg></button>
        <label for="file" class="icon-btn" data-i18n-aria="newTrack" aria-label="New track">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
        </label>
      </header>

      <div class="cover-wrap">
        <div id="coverFrame" class="cover">
          <img id="cover" alt="" />
          <button id="altCoverBtn" class="cover-btn alt" hidden data-i18n-aria="findOtherCover" aria-label="Find another cover">
            <svg class="i-search" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="M16 16l4.5 4.5" /></svg>
            <svg class="i-restore" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7" /><path d="M4 4v4h4" /></svg>
          </button>
          <label for="coverFile" id="chooseCoverBtn" class="cover-btn pick" role="button" tabindex="0" data-i18n-aria="chooseCover" aria-label="Choose cover image">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2.5" /><circle cx="9" cy="10" r="1.6" /><path d="M20.5 15.5l-4.5-4.5-7.5 8" /></svg>
          </label>
          <input id="coverFile" class="visually-hidden" type="file" accept="image/*" />
          <button id="blurBtn" class="cover-btn" aria-pressed="false" data-i18n-aria="blurCover" aria-label="Blur cover">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5c3.4 4 5.8 7.1 5.8 10.1a5.8 5.8 0 0 1-11.6 0C6.2 10.6 8.6 7.5 12 3.5z" /><path d="M9.2 14.2a2.8 2.8 0 0 0 2.8 2.8" /></svg>
          </button>
          <div id="nameSuggest" class="name-suggest" hidden>
            <div class="name-suggest-text">
              <small data-i18n="useNamesQ"></small>
              <b id="suggestTitle"></b>
              <span id="suggestArtist"></span>
            </div>
            <button id="suggestUse" class="suggest-use" data-i18n="useNames"></button>
            <button id="suggestNo" class="suggest-no" data-i18n-aria="dismiss" aria-label="Dismiss">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
            </button>
          </div>
          <button id="findCoverBtn" class="find-cover" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="M16 16l4.5 4.5" /></svg>
            <span id="findCoverLabel" data-i18n="findCover"></span>
          </button>
        </div>
      </div>

      <div class="meta-row">
        <div id="editInfo" class="meta editable" role="button" tabindex="0" data-i18n-aria="editInfo" aria-label="Edit title and artist">
          <div id="title" class="title"></div>
          <div class="artist-row">
            <span id="artist" class="artist"></span>
            <svg class="edit-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4" /></svg>
          </div>
        </div>
        <button id="repeatBtn" class="icon-btn toggle" data-i18n-aria="repeat" aria-label="Repeat" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M17 3l3 3-3 3" /><path d="M4 11V9a3 3 0 0 1 3-3h13" /><path d="M7 21l-3-3 3-3" /><path d="M20 13v2a3 3 0 0 1-3 3H4" /></svg>
        </button>
        <button id="openTimeline" class="icon-btn" hidden data-i18n-aria="timeline" aria-label="Timeline">
          <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" /><path d="M4 15l4-5 4 3 4-6 4 4" /></svg>
        </button>
        <button id="openExport" class="icon-btn" data-i18n-aria="export" aria-label="Export">
          <svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" /></svg>
        </button>
        <button id="openMenu" class="icon-btn" data-i18n-aria="more" aria-label="More">
          <svg viewBox="0 0 24 24" class="dots"><circle cx="5" cy="12" r="1.6" /><circle cx="12" cy="12" r="1.6" /><circle cx="19" cy="12" r="1.6" /></svg>
        </button>
      </div>

      <div class="scrub">
        <div id="bar" class="bar"><div id="barFill" class="bar-fill"></div></div>
        <div class="scrub-times">
          <span id="tNow">0:00</span>
          <span id="badge" class="pill"></span>
          <span id="tLeft">−0:00</span>
        </div>
      </div>

      <div class="dash glass" id="dash">
        <div class="pages" id="pages">
          <section class="page page-play" data-page="play">
            <button id="prevTrack" class="skip-btn track-btn" hidden data-i18n-aria="prevTrack" aria-label="Previous">
              <svg viewBox="0 0 24 24"><path d="M6 5v14" /><path d="M19 5.8v12.4a.8.8 0 0 1-1.2.7L9 12.7a.8.8 0 0 1 0-1.4l8.8-6.2a.8.8 0 0 1 1.2.7z" /></svg>
            </button>
            <button id="play" class="play-btn play-toggle" data-i18n-aria="play" aria-label="Play">
              <svg viewBox="0 0 24 24" class="i-play"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" /></svg>
              <svg viewBox="0 0 24 24" class="i-pause"><rect x="6" y="5" width="4.2" height="14" rx="1.3" /><rect x="13.8" y="5" width="4.2" height="14" rx="1.3" /></svg>
            </button>
            <button id="nextTrack" class="skip-btn track-btn" hidden data-i18n-aria="nextTrack" aria-label="Next">
              <svg viewBox="0 0 24 24"><path d="M18 5v14" /><path d="M5 5.8v12.4a.8.8 0 0 0 1.2.7l8.8-6.2a.8.8 0 0 0 0-1.4L6.2 5.1A.8.8 0 0 0 5 5.8z" /></svg>
            </button>
          </section>

          <section class="page page-lyrics" data-page="lyrics">
            <div class="page-head">
              <h4 data-i18n="lyrics"></h4>
              <span class="readout" data-i18n="lyricsSource"></span>
              <button class="mini-play play-toggle" data-i18n-aria="play" aria-label="Play">
            <svg viewBox="0 0 24 24" class="i-play"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" /></svg>
            <svg viewBox="0 0 24 24" class="i-pause"><rect x="6" y="5" width="4.2" height="14" rx="1.3" /><rect x="13.8" y="5" width="4.2" height="14" rx="1.3" /></svg>
          </button>
            </div>
            <div class="lyrics-wrap" id="lyricsWrap">
              <div id="lyricsBox" class="lyrics"></div>
              <p id="lyricsStatus" class="lyrics-status"></p>
            </div>
          </section>

          <section class="page page-drive" data-page="drive">
            <div class="gauge" aria-live="off">
              <div id="bpmBig" class="bpm-big">—</div>
              <div class="bpm-label">BPM</div>
              <div id="gaugeSub" class="gauge-sub"></div>
              <button id="keepPitchBtn" class="pitch-chip" aria-pressed="false" data-i18n-aria="keepPitchAria" aria-label="Keep the original pitch">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12" /><circle cx="6.5" cy="18" r="2.5" /><circle cx="16.5" cy="16" r="2.5" /></svg>
                <span data-i18n="keepPitch"></span>
              </button>
              <button id="lockSpeedBtn" class="pitch-chip" aria-pressed="false" data-i18n-aria="lockSpeedAria" aria-label="Keep this speed for the next songs">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2" /><path d="M8 11V8a4 4 0 0 1 8 0v3" /></svg>
                <span data-i18n="lockSpeed"></span>
              </button>
            </div>
            <div id="pedal" class="pedal" data-i18n-aria="speed" aria-label="Speed"></div>
            <div class="play-slot">
              <button class="play-btn play-toggle" data-i18n-aria="play" aria-label="Play">
                <svg viewBox="0 0 24 24" class="i-play"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" /></svg>
            <svg viewBox="0 0 24 24" class="i-pause"><rect x="6" y="5" width="4.2" height="14" rx="1.3" /><rect x="13.8" y="5" width="4.2" height="14" rx="1.3" /></svg>
              </button>
            </div>
          </section>

          <section class="page page-space" data-page="space">
            <div class="page-head">
              <label class="switch small">
                <input id="autoSpace" type="checkbox" checked />
                <span class="track"><i></i></span>
                <span data-i18n="autoSpace"></span>
              </label>
              <button id="smallRoom" class="mini-chip" data-i18n="smallRoom"></button>
              <button class="mini-play play-toggle" data-i18n-aria="play" aria-label="Play">
            <svg viewBox="0 0 24 24" class="i-play"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" /></svg>
            <svg viewBox="0 0 24 24" class="i-pause"><rect x="6" y="5" width="4.2" height="14" rx="1.3" /><rect x="13.8" y="5" width="4.2" height="14" rx="1.3" /></svg>
          </button>
            </div>
            <div class="space-cols">
              <div class="col">
                <h4 data-i18n="reverb"></h4>
                <div class="slider"><span data-i18n="mix"></span><output id="oMix"></output>
                  <input id="mix" type="range" min="0" max="1" step="0.01" value="0" /></div>
                <div class="slider"><span data-i18n="size"></span><output id="oDecay"></output>
                  <input id="decay" type="range" min="0.6" max="8" step="0.1" value="2.5" /></div>
                <div class="slider"><span data-i18n="tone"></span><output id="oTone"></output>
                  <input id="tone" type="range" min="0" max="1" step="0.01" value="0.5" /></div>
              </div>
              <div class="col">
                <h4 data-i18n="echo"></h4>
                <div class="slider"><span data-i18n="mix"></span><output id="oDelayMix"></output>
                  <input id="delayMix" type="range" min="0" max="1" step="0.01" value="0" /></div>
                <div class="slider"><span data-i18n="echoTime"></span><output id="oDelayTime"></output>
                  <input id="delayTime" type="range" min="0.05" max="1.5" step="0.005" value="0.375" /></div>
                <div class="slider"><span data-i18n="feedback"></span><output id="oDelayFeedback"></output>
                  <input id="delayFeedback" type="range" min="0" max="0.85" step="0.01" value="0.35" /></div>
              </div>
            </div>
          </section>

          <section class="page page-eq" data-page="eq">
            <div class="page-head">
              <h4 data-i18n="eq"></h4>
              <span id="eqReadout" class="readout"></span>
              <button class="mini-play play-toggle" data-i18n-aria="play" aria-label="Play">
            <svg viewBox="0 0 24 24" class="i-play"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" /></svg>
            <svg viewBox="0 0 24 24" class="i-pause"><rect x="6" y="5" width="4.2" height="14" rx="1.3" /><rect x="13.8" y="5" width="4.2" height="14" rx="1.3" /></svg>
          </button>
            </div>
            <canvas id="eqCanvas" class="eq-canvas" aria-label="Equalizer"></canvas>
          </section>

          <section class="page page-chop" data-page="chop">
            <div class="page-head">
              <h4 data-i18n="chop"></h4>
              <p id="selInfo" class="sel-info"></p>
              <button class="mini-play play-toggle" data-i18n-aria="play" aria-label="Play">
            <svg viewBox="0 0 24 24" class="i-play"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" /></svg>
            <svg viewBox="0 0 24 24" class="i-pause"><rect x="6" y="5" width="4.2" height="14" rx="1.3" /><rect x="13.8" y="5" width="4.2" height="14" rx="1.3" /></svg>
          </button>
            </div>
            <canvas id="wave" class="wave"></canvas>
            <div class="tools">
              <button id="tMarker"><b>＋</b><span data-i18n="marker"></span></button>
              <button id="tLoop"><b>⟲</b><span data-i18n="loop"></span></button>
              <button id="tTrim"><b>⇤⇥</b><span data-i18n="trim"></span></button>
              <button id="tCut"><b>✂</b><span data-i18n="cut"></span></button>
              <button id="tUndo"><b>↶</b><span data-i18n="undo"></span></button>
            </div>
            <div id="markerList" class="marker-list"></div>
          </section>
        </div>
        <div class="page-dots" id="dots" role="tablist">
          <button data-go="0" aria-label="Play"></button>
          <button data-go="1" aria-label="Lyrics"></button>
          <button data-go="2" aria-label="Speed"></button>
          <button data-go="3" aria-label="Reverb"></button>
          <button data-go="4" aria-label="Equalizer"></button>
          <button data-go="5" aria-label="Chop"></button>
        </div>
        <button id="pagePrev" class="page-arrow prev" disabled data-i18n-aria="prevPage" aria-label="Previous">
          <svg viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6" /></svg>
        </button>
        <button id="pageNext" class="page-arrow next" data-i18n-aria="nextPage" aria-label="Next">
          <svg viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6" /></svg>
        </button>
        <button id="swipeHint" class="swipe-hint" hidden>
          <svg class="hand" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" /></svg>
          <span class="touch-only" data-i18n="swipeHint"></span>
          <span class="mouse-only" data-i18n="clickHint"></span>

              <button id="scDescClear" type="button" class="link-btn" data-i18n="scRemoveDesc"></button></span>
            <textarea id="scDesc" rows="3" maxlength="4000"></textarea>
          </label>
          <label class="field">
            <small data-i18n="scFieldTags"></small>
            <input id="scTags" type="text" autocomplete="off" autocapitalize="off" />
            <small class="hint" data-i18n="scTagsHint"></small>
          </label>

          <div class="sc-art">
            <img id="scArt" alt="" />
            <div>
              <small data-i18n="scArtwork"></small>
              <label class="switch small">
                <input id="scWatermark" type="checkbox" checked />
                <span class="track"><i></i></span>
                <span data-i18n="scWatermark"></span>
              </label>
            </div>
          </div>

          <div class="formats" role="radiogroup">
            <label><input type="radio" name="scSharing" value="private" checked /><span data-i18n="scPrivate"></span></label>
            <label><input type="radio" name="scSharing" value="public" /><span data-i18n="scPublic"></span></label>
          </div>

          <label class="check">
            <input id="scRights" type="checkbox" />
            <span data-i18n="scRights"></span>
          </label>
          <p class="hint" data-i18n="scCopyrightNote"></p>
        </div>

        <button id="scGo" class="primary"></button>
        <div id="scProgress" class="progress" hidden><div></div></div>
        <p id="scStatus" class="status" aria-live="polite"></p>
        <a id="scResult" class="download" target="_blank" rel="noopener" hidden data-i18n="scOpenTrack"></a>
        <p class="fine legal"><a href="/privacy" data-i18n="privacyLink"></a> · <a href="/terms" data-i18n="termsLink"></a></p>
        <p class="fine legal made-by"><span data-i18n="madeBy"></span> <a href="https://instagram.com/iliyabarcari" target="_blank" rel="noopener">@iliyabarcari</a></p>
      </div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
